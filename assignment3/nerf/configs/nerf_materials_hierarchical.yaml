seed: 1

type: train_nerf

training:
  num_epochs: 250
  batch_size: 1024
  lr: 0.0001

  lr_scheduler_step_size: 50
  lr_scheduler_gamma: 0.8

  checkpoint_path: ./checkpoints_materials_hierarchical.pth
  checkpoint_interval: 50
  resume: True

  render_interval: 10
  render_gif_path: images/part_4_2_materials_hierarchical.gif

data:
  image_size: [128, 128]
  dataset_name: materials

renderer:
  type: volume
  chunk_size: 32768
  white_background: False

sampler:
  type: stratified
  n_pts_per_ray: 64          # N_coarse: uniform samples for the coarse network

  min_depth: 1.0
  max_depth: 7.0

  # Q4.2: coarse/fine hierarchical sampling
  use_hierarchical_sampling: true
  n_pts_per_ray_fine: 64     # N_fine: importance samples; fine network sees 64 + 64 = 128

implicit_function:
  type: nerf

  n_harmonic_functions_xyz: 6
  n_harmonic_functions_dir: 2
  n_hidden_neurons_xyz: 128
  n_hidden_neurons_dir: 64
  density_noise_std: 0.0
  n_layers_xyz: 6
  append_xyz: [3]
  use_view_dependence: true
